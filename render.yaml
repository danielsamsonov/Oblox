# Free web service with an external Neon Free PostgreSQL database.
# DATABASE_URL must be supplied as a secret; never use ephemeral JSON storage here.
services:
  - type: web
    name: oblox-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OBLOX_REQUIRE_DATABASE
        value: "1"
      - key: PAYMENTS
        value: mock
      - key: OBLOX_DISCOVERY_PORT
        value: "0"
      - key: TRUST_PROXY_HOPS
        value: "0"
      - key: NODE_VERSION
        value: "24"
